<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" aria-label="Vista previa del proyecto Portfolio">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055d4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="600" height="350" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="596" height="346" rx="14" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Browser window chrome -->
  <rect x="20" y="20" width="560" height="310" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <path d="M20 54 L580 54" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="40" cy="37" r="5" fill="#ef4444"/>
  <circle cx="56" cy="37" r="5" fill="#f59e0b"/>
  <circle cx="72" cy="37" r="5" fill="#10b981"/>

  <!-- URL Bar -->
  <rect x="100" y="28" width="300" height="18" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="110" y="41" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">https://arnaudaw.github.io/portfolio/</text>

  <!-- Content Elements -->
  <!-- Tagline -->
  <rect x="45" y="80" width="120" height="16" rx="4" fill="url(#accentGrad)" opacity="0.3"/>
  <text x="55" y="92" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60a5fa">&lt;developer&gt;</text>

  <!-- Title -->
  <text x="45" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#ffffff">Arnau Domenech Blanquer</text>
  <text x="45" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#38bdf8">Desarrollador Web · Frontend · CI/CD</text>

  <!-- Metric boxes -->
  <g transform="translate(45, 185)">
    <rect width="110" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#60a5fa">100%</text>
    <text x="15" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Lighthouse SEO</text>
  </g>

  <g transform="translate(170, 185)">
    <rect width="110" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#10b981">100%</text>
    <text x="15" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Accesibilidad</text>
  </g>

  <g transform="translate(295, 185)">
    <rect width="110" height="70" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#a855f7">4 Jobs</text>
    <text x="15" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">Pipeline CI/CD</text>
  </g>

  <!-- CI/CD Badges on right side -->
  <g transform="translate(425, 80)">
    <rect width="130" height="175" rx="8" fill="rgba(0,85,212,0.08)" stroke="rgba(0,85,212,0.2)"/>
    <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#60a5fa">// checks</text>
    
    <text x="15" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">✓ HTML válido</text>
    <text x="15" y="85" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">✓ Enlaces vivos</text>
    <text x="15" y="115" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">✓ Formato</text>
    <text x="15" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">✓ Calidad</text>
  </g>

  <!-- Bottom status -->
  <text x="45" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">● Desplegado y verificado en GitHub Pages</text>
</svg>

